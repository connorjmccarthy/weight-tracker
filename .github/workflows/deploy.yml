name: Deploy to GitHub Pages

# Manual only.
#
# GitHub Pages has to be switched on for the repository before this can publish, and the
# Actions token isn't allowed to do that for you — `configure-pages` returns a permission
# error until a repo admin sets Settings → Pages → Source to "GitHub Actions". Running this
# on every push would just paint the branch red, so it waits to be asked.
#
# Once Pages is on: Actions → "Deploy to GitHub Pages" → Run workflow. The site lands at
# https://connorjmccarthy.github.io/weight-tracker/ and this can be switched back to
# running on push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. A run already in progress finishes rather than being
# cancelled, so the site is never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken build must not reach the phone. The energy and trend maths decide what
      # this app tells someone to eat, so a red test is a blocked deploy.
      - run: npm test
      - run: npm run typecheck

      - uses: actions/configure-pages@v5

      - name: Build
        # Pages serves this project from /weight-tracker/, not the domain root.
        run: BASE_PATH=/weight-tracker/ npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
