name: CI

on:
  push:
    branches: [claude/weight-loss-food-tracker-1c4uvm]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The energy and trend maths decides what this app tells someone to eat,
      # so a red test blocks everything downstream of it.
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
